# Overlay compose.yaml; no build or Node required on the host.
services:
  sso:
    command: ['start', '--import-realm']
    pull_policy: never
    environment:
      KC_HOSTNAME: ${SSO_URL:?Set the public HTTPS SSO URL}
      KC_HOSTNAME_STRICT: 'true'
      KC_HTTP_ENABLED: 'true'
      KC_HTTP_RELATIVE_PATH: /sso
      KC_HTTP_MANAGEMENT_RELATIVE_PATH: /sso
      KC_PROXY_HEADERS: xforwarded
    networks:
      - default
      - sso-backend
    healthcheck:
      test: ['CMD', 'bash', '-ec', 'exec 3<>/dev/tcp/127.0.0.1/9000; printf "GET /sso/health/ready HTTP/1.0\r\n\r\n" >&3; head -1 <&3 | grep -q "200"']
networks:
  sso-backend:
    external: true
    name: ${SSO_NETWORK:-musicque_music-order-network}
