# Overlay compose.yaml; no build or Node required on the host.
services:
  sso:
    command: ['start', '--import-realm']
    pull_policy: never
    environment:
      KC_HOSTNAME: ${SSO_URL:?Set the public HTTPS SSO URL}
      KC_HOSTNAME_STRICT: 'true'
      # nginx blocks /sso/admin from the Internet; the admin console is reached only via an SSH tunnel
      # (`pnpm sso:admin`, local 18180 -> server 127.0.0.1:8180), so it advertises that URL instead.
      KC_HOSTNAME_ADMIN: ${SSO_ADMIN_HOSTNAME:-http://localhost:18180/sso}
      KC_HTTP_ENABLED: 'true'
      KC_HTTP_RELATIVE_PATH: /sso
      KC_HTTP_MANAGEMENT_RELATIVE_PATH: /sso
      KC_PROXY_HEADERS: xforwarded
    networks:
      - default
      - sso-backend
    healthcheck:
      test: ['CMD', 'bash', '-ec', 'exec 3<>/dev/tcp/127.0.0.1/9000; printf "GET /sso/health/ready HTTP/1.0\r\n\r\n" >&3; head -1 <&3 | grep -q "200"']
networks:
  sso-backend:
    external: true
    name: ${SSO_NETWORK:-musicque_music-order-network}
