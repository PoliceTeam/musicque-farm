name: musicque-sso
services:
  sso-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sso
      POSTGRES_USER: sso
      POSTGRES_PASSWORD: ${SSO_DATABASE_PASSWORD:?Run node apps/sso/init.mjs first}
    volumes:
      - sso-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sso -d sso']
      interval: 3s
      timeout: 3s
      retries: 30
  sso:
    build: .
    image: musicque-sso-keycloak:26.8.1
    restart: unless-stopped
    command: ['start-dev', '--import-realm']
    ports:
      - '127.0.0.1:${SSO_PORT:-8180}:8080'
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://sso-db:5432/sso
      KC_DB_USERNAME: sso
      KC_DB_PASSWORD: ${SSO_DATABASE_PASSWORD:?Run node apps/sso/init.mjs first}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${SSO_ADMIN_USERNAME:-sso-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${SSO_ADMIN_PASSWORD:?Run node apps/sso/init.mjs first}
      KC_HOSTNAME: ${SSO_URL:-http://127.0.0.1:8180}
      KC_HEALTH_ENABLED: 'true'
      SSO_FARM_REDIRECT_URI: ${SSO_FARM_REDIRECT_URI:-http://127.0.0.1:3010/api/auth/sso/callback}
      SSO_MUSICQUE_REDIRECT_URI: ${SSO_MUSICQUE_REDIRECT_URI:-http://localhost:8080/api/auth/sso/callback}
      SSO_FARM_CLIENT_SECRET: ${SSO_FARM_CLIENT_SECRET:?Run node apps/sso/init.mjs first}
      SSO_MUSICQUE_CLIENT_SECRET: ${SSO_MUSICQUE_CLIENT_SECRET:?Run node apps/sso/init.mjs first}
    volumes:
      - ./realm:/opt/keycloak/data/import:ro
    depends_on:
      sso-db:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'bash', '-ec', 'exec 3<>/dev/tcp/127.0.0.1/9000; printf "GET /health/ready HTTP/1.0\r\n\r\n" >&3; head -1 <&3 | grep -q "200"']
      interval: 5s
      timeout: 5s
      start_period: 60s
      retries: 30
volumes:
  sso-data:
