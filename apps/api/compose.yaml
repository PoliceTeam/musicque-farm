name: chibi-town
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: chibi
      POSTGRES_PASSWORD: chibi
      POSTGRES_DB: chibi_town
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U chibi -d chibi_town']
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  postgres-data:
