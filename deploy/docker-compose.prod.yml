# Production stack for one server. nginx on the host proxies the domain:
#   /api (including the /api/ws WebSocket) -> 127.0.0.1:${API_PORT}, everything else -> 127.0.0.1:${WEB_PORT}
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-chibi_town}
      POSTGRES_USER: ${DATABASE_USERNAME:-chibi}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DATABASE_USERNAME:-chibi} -d ${DATABASE_NAME:-chibi_town}']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

  # Optional coordination for multiple API instances:
  # start with `docker compose --profile realtime up -d`, set REDIS_URL=redis://redis:6379.
  # A single API instance may leave REDIS_URL empty and omit this profile.
  redis:
    image: redis:7-alpine
    profiles: ['realtime']
    restart: unless-stopped
    networks:
      - internal

  api:
    image: chibi-town-api:latest
    pull_policy: never
    restart: unless-stopped
    ports:
      - '127.0.0.1:${API_PORT:-3201}:3001'
    environment:
      DATABASE_URL: postgres://${DATABASE_USERNAME:-chibi}:${DATABASE_PASSWORD}@postgres:5432/${DATABASE_NAME:-chibi_town}
      WEB_ORIGIN: ${PUBLIC_URL:?PUBLIC_URL is required}
      PUBLIC_API_URL: ${PUBLIC_URL}/api
      REDIS_URL: ${REDIS_URL:-}
      TRUST_PROXY: 'true'
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 256m
    networks:
      - internal

  web:
    image: chibi-town-web:latest
    pull_policy: never
    restart: unless-stopped
    ports:
      - '127.0.0.1:${WEB_PORT:-3200}:3000'
    depends_on:
      - api
    mem_limit: 320m
    networks:
      - internal

networks:
  internal:

volumes:
  pgdata:
